# ============================================================
# 知识库管理平台 - 依赖服务编排（SPEC §4 部署拓扑）
#
#   docker compose up -d            启动全部依赖
#   docker compose ps               查看状态
#   docker compose down             停止（保留数据卷目录）
#
# 说明：
#   1. 后端应用不在此编排中，按 README 直接在宿主机运行（需要访问 GPU）
#   2. MinIO 同时充当对象存储与 Milvus 的后端存储（SPEC §4.1 部署要点 2）
#   3. 端口对外映射仅便于本机开发；生产环境请关闭除应用端口外的映射
#   4. 若拉取镜像缓慢，请为 Docker Desktop 配置国内镜像加速
# ============================================================
name: kb-platform

services:
  # ---------------- MySQL：用户/权限/知识元数据/看板/FAQ ----------------
  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DB:-kb_platform}
      MYSQL_USER: ${MYSQL_USER:-kb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kb_pass_2026}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_pass_2026}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ---------------- MongoDB：AI 会话历史 ----------------
  mongo:
    image: mongo:7.0
    container_name: kb-mongo
    environment:
      TZ: Asia/Shanghai
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---------------- etcd：Milvus 元数据 ----------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: kb-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ---------------- MinIO：对象存储（Milvus 后端 + 业务原文件） ----------------
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: kb-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-kbminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-kbminio_pass_2026}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - ./volumes/minio:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  # ---------------- Milvus：向量检索（standalone） ----------------
  milvus:
    image: milvusdb/milvus:v2.5.5
    container_name: kb-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-kbminio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-kbminio_pass_2026}
    ports:
      - "19530:19530"  # SDK 端口
      - "9091:9091"    # 健康检查/指标
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # ---------------- Attu：Milvus 可视化管理台（可选，便于调试） ----------------
  attu:
    image: zilliz/attu:v2.5.10
    container_name: kb-attu
    environment:
      - MILVUS_URL=milvus:19530
      - ATTU_LOG_LEVEL=info
    ports:
      - "8000:3000"
    depends_on:
      - milvus
    restart: unless-stopped

networks:
  default:
    name: kb-net
