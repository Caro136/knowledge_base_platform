[project]
name = "backend"
version = "0.1.0"
description = "知识库管理平台后端服务（T-01/T-02 骨架）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1",
    "cryptography>=42.0",
    # 密码哈希：passlib 1.7.4 与 bcrypt>=4.1 存在告警，锁定 4.0.1
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3",
    # T-11：对象存储客户端 + 文件上传表单解析
    "minio>=7.2",
    "python-multipart>=0.0.9",
    # T-12：导入工作流编排
    "langgraph>=0.2",
    # T-13：向量库客户端 + BGE-M3 稠密/稀疏嵌入（会带入 torch / transformers）
    "pymilvus>=2.4",
    "FlagEmbedding>=1.2",
    # T-24：会话历史存储
    "pymongo>=4.7",
]

# 说明：本项目以"应用"形式运行（python -m app.main），无需打包安装，
# 因此不声明 build-system，uv 会将其视为 virtual project（只装依赖，不装自身）。
# 包索引配置见同目录 uv.toml（使用国内镜像）。
